[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
incremental = false

[workspace]
resolver = "2"
members = [
    "bus/cbus",
    "bus/cbus-core",
    "devkit/creamy-devkit",
    "devkit/creamy-devkit-cli",
    "devkit/creamy-libgen",
    "devkit/creamy-libgen-c",
    "devkit/creamy-libgen-rs",
    "devkit/creamy-manifest",
    "devkit/creamy-protocol-tui",
    "devkit/creamy-sdk",
    "devkit/creamy-testbench",
    "devkit/creamy-utils",
    "devkit/creamy-xmlc",
    "engine/creamy",
    "engine/creamy-cbus-driver",
    "engine/creamy-engine-core",
    "engine/creamy-async-loader",
    "engine/creamy-loader",
    "engine/creamy-wasmtime",
    "engine/creamy-system-plugin",
    "engine/pathenv",
    "examples/ping/plugin",
]

[workspace.dependencies]
cbus = { path = "bus/cbus" }
cbus-core = { path = "bus/cbus-core" }

creamy-devkit = { path = "devkit/creamy-devkit" }
creamy-libgen = { path = "devkit/creamy-libgen" }
creamy-libgen-c = { path = "devkit/creamy-libgen-c" }
creamy-libgen-rs = { path = "devkit/creamy-libgen-rs" }
creamy-manifest = { path = "devkit/creamy-manifest" }
creamy-protocol-tui = { path = "devkit/creamy-protocol-tui" }
creamy-utils = { path = "devkit/creamy-utils" }
creamy-xmlc = { path = "devkit/creamy-xmlc" }
creamy-sdk = { path = "devkit/creamy-sdk" }
creamy-testbench = { path = "devkit/creamy-testbench"}

# Engine
creamy = { path = "engine/creamy" }
creamy-cbus-driver = { path = "engine/creamy-cbus-driver" }
creamy-engine-core = { path = "engine/creamy-engine-core" }
creamy-async-loader = { path = "engine/creamy-async-loader" }
creamy-loader = { path = "engine/creamy-loader" }
creamy-wasmtime= { path = "engine/creamy-wasmtime" }
creamy-system-plugin = { path = "engine/creamy-system-plugin" }
pathenv = { path = "engine/pathenv" }

anyhow = "1.0.104"
as-guard = "0.1.0"
idmint = { version = "0.2.2", features = ["stack"] }
static_assertions = "1.1.0"
cfg-if = "1.0.4"
syn = "3.0.4"
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
bitflags = "2.13.1"
chrono = "0.4.45"
derive_more = { version = "2.1.1", features = ["from", "display"] }
notify = "8.2.0"
regex = "1.13.1"
tree-sitter = "0.27.0"
zip = "8.6.0"
env_logger = "0.11.11"
lazy_static = "1.5.0"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tracy = "0.12.0"
downcast-rs = "2.0.2"
binrw = "0.15.2"
thiserror = { version = "2.0.20", features = ["default"] }
roxmltree = "0.21.1"
strum = { version = "0.28.0", features = ["derive"] }
ptree = "0.5.2"
console = "0.16.4"
semver = { version = "1.0.28", features = ["serde"] }
inotify = "0.11.5"
rustc-hash = "2.1.3"

[workspace.dependencies.serde]
version = "1.0.229"
features = ["derive", "std"]

[workspace.dependencies.clap]
version = "4.6.6"
features = ["derive"]
default-features = true

[workspace.dependencies.toml]
version = "1.1.5"
default-features = false
features = ["serde", "parse"]
