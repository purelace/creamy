[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
incremental = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
#missing_docs = "deny"
#missing_errors_doc = "deny"

[workspace]
resolver = "2"
members = [
    "bus/cbus",
    "bus/cbus-core",

    "devkit/creamy-devkit",
    "devkit/creamy-devkit-cli",
    "devkit/creamy-libgen",
    "devkit/creamy-libgen-rs",
    "devkit/creamy-manifest",
    "devkit/creamy-protocol-tui",
    "devkit/creamy-phf",
    "devkit/creamy-sdk",
    "devkit/creamy-template",
    "devkit/creamy-utils",
    "devkit/creamy-xmlc",
    "devkit/creamy-phf",

    "engine/creamy",
    "engine/creamy-cbus-driver",
    "engine/creamy-engine-core",
    "engine/creamy-async-loader",
    "engine/creamy-loader",
    "engine/creamy-wasmtime",
    "engine/pathenv",

    "examples/ping",
    "examples/pong",
    "examples/shell",
    "examples/shell/commands/*", "devkit/creamy-protocol-model-macros", "devkit/creamy-protocol-model", "devkit/creamy-binary", "devkit/creamy-binary-derive",
]

[workspace.dependencies]
cbus = { path = "bus/cbus" }
cbus-core = { path = "bus/cbus-core" }

creamy-devkit = { path = "devkit/creamy-devkit" }
creamy-libgen = { path = "devkit/creamy-libgen" }
creamy-libgen-rs = { path = "devkit/creamy-libgen-rs" }
creamy-manifest = { path = "devkit/creamy-manifest" }
creamy-protocol-tui = { path = "devkit/creamy-protocol-tui" }
creamy-utils = { path = "devkit/creamy-utils" }
creamy-xmlc = { path = "devkit/creamy-xmlc" }
creamy-phf = { path = "devkit/creamy-phf" }
creamy-sdk = { path = "devkit/creamy-sdk" }
creamy-template = { path = "devkit/creamy-template" }
creamy-protocol-model = { path = "devkit/creamy-protocol-model" }
creamy-protocol-model-macros = { path = "devkit/creamy-protocol-model-macros"}
#creamy-binary = { path = "devkit/creamy-binary" }
#creamy-binary-derive = { path = "devkit/creamy-binary-derive" }

# Engine
creamy = { path = "engine/creamy" }
creamy-engine-core = { path = "engine/creamy-engine-core" }
creamy-async-loader = { path = "engine/creamy-async-loader" }
creamy-loader = { path = "engine/creamy-loader" }
creamy-wasmtime= { path = "engine/creamy-wasmtime" }
pathenv = { path = "engine/pathenv" }

anyhow = "1.0.104"
as-guard = "0.1.0"
idmint = { version = "0.2.2", features = ["stack"] }
static_assertions = "1.1.0"
cfg-if = "1.0.5"
criterion = { version = "0.8.2", features = ["html_reports"] }
bitflags = "2.13.2"
tempfile = "3.27.0"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tracing-subscriber = "0.3.23"
downcast-rs = { version = "2.0.2", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
roxmltree = "0.21.1"
strum = { version = "0.28.0", features = ["derive"] }
ptree = "0.5.2"
console = "0.16.6"
semver = { version = "1.0.28", features = ["serde", "std"] }
inotify = "0.11.5"
hashbrown = "0.17.1"
smol_str = { version = "0.3.6", default-features = false }

quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
proc-macro2 = "1.0.107"

[workspace.dependencies.serde]
version = "1.0.229"
default-features = false
features = ["derive"]

[workspace.dependencies.clap]
version = "4.6.7"
features = ["derive"]
default-features = true

[workspace.dependencies.toml]
version = "1.1.8"
default-features = false
features = ["serde", "parse"]
