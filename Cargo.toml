[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = false
#lto = "fat"
opt-level = 3
codegen-units = 1
incremental = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
#missing_docs = "deny"
#missing_errors_doc = "deny"

[workspace]
resolver = "2"
members = [
    "bus/cbus",
    "bus/cbus/fuzz",
    "bus/cbus-core",

    "core/creamy-protocol-model-macros",
    "core/creamy-protocol-model",
    "core/creamy-binary",
    "core/creamy-binary-derive",
    "core/creamy-plugin-package",
    "core/creamy-manifest",
    "core/creamy-phf",
    "core/creamy-sdk",
    "core/creamy-utils",
    "core/creamy-phf",

    "tools/creamy-devkit-cli",
    "tools/creamy-protocol-tui",
    "tools/creamy-libgen",
    "tools/creamy-libgen-rs",
    "tools/creamy-template",
    "tools/creamy-xmlc",

    "engine/creamy",
    "engine/creamy-cbus-driver",
    "engine/creamy-engine-core",
    "engine/creamy-async-loader",
    "engine/creamy-loader",
    "engine/creamy-wasmtime",
    "engine/pathenv",

    "examples/ping",
    "examples/pong",
    "examples/shell",
    "examples/shell/commands/*",
]

[workspace.dependencies]
cbus = { path = "bus/cbus" }
cbus-core = { path = "bus/cbus-core" }

# Tools (std)
creamy-protocol-tui = { path = "tools/creamy-protocol-tui" }
creamy-libgen = { path = "tools/creamy-libgen" }
creamy-libgen-rs = { path = "tools/creamy-libgen-rs" }
creamy-xmlc = { path = "tools/creamy-xmlc" }
creamy-template = { path = "tools/creamy-template" }

# Core (no_std)
creamy-plugin-package = { path = "core/creamy-plugin-package" }
creamy-manifest = { path = "core/creamy-manifest" }
creamy-utils = { path = "core/creamy-utils" }
creamy-phf = { path = "core/creamy-phf" }
creamy-sdk = { path = "core/creamy-sdk" }
creamy-protocol-model = { path = "core/creamy-protocol-model" }
creamy-protocol-model-macros = { path = "core/creamy-protocol-model-macros"}

# Engine
creamy = { path = "engine/creamy" }
creamy-engine-core = { path = "engine/creamy-engine-core" }
creamy-async-loader = { path = "engine/creamy-async-loader" }
creamy-loader = { path = "engine/creamy-loader" }
creamy-wasmtime= { path = "engine/creamy-wasmtime" }
pathenv = { path = "engine/pathenv" }

# no_std
thiserror = { version = "2.0.21", default-features = false }
downcast-rs = { version = "2.0.2", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["serde"] }
smol_str = { version = "0.3.7", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
as-guard = "0.1.0"


anyhow = "1.0.104"
idmint = { version = "0.2.2", features = ["stack"] }
static_assertions = "1.1.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
bitflags = "2.13.2"
tempfile = "3.27.0"
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
tracing-subscriber = "0.3.23"
roxmltree = "0.21.1"
ptree = "0.5.2"
console = "0.16.6"
inotify = "0.11.5"

hashbrown = { version = "0.17.1", features = ["serde"] }

quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }
proc-macro2 = "1.0.107"

[workspace.dependencies.serde]
version = "1.0.229"
default-features = false
features = ["derive"]

[workspace.dependencies.clap]
version = "4.6.7"
features = ["derive"]
default-features = true

[workspace.dependencies.toml]
version = "1.1.8"
default-features = false
features = ["serde", "parse"]
