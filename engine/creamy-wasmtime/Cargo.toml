[package]
name = "creamy-wasmtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
creamy-engine-core.workspace = true
creamy-binary = { path = "../../core/creamy-binary", features=["std"] }
inotify.workspace = true
log.workspace = true
thiserror.workspace = true
wasmtime = { version = "50.0.1", default-features = false, features = [
    "runtime",
    "cranelift",
    "pooling-allocator",

    # debug features
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
] }

garde = { version = "0.23.0", features = [ "derive" ] }
serde.workspace = true
pathenv.workspace = true

# async
futures-util = { version = "0.3.34", optional = true }
[dependencies.tokio]
version = "1.54.1"
default-features = false
optional = true
features = ["fs", "rt", "io-util", "macros", "sync", "time", "rt-multi-thread"]

[features]
async-loader = [
    "dep:tokio",
    "dep:futures-util",
]

ui-events = []

[dev-dependencies]
creamy.workspace = true
anyhow.workspace = true
pathenv.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
