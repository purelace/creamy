[package]
name = "creamy-devkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
creamy-devkit = { workspace = true, features = ["write"] }
creamy-protocol-tui.workspace = true
creamy-template.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
rustyline = "18.0.1"
anyhow.workspace = true
fs-err = { version = "3.3.1", features = ["debug"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile.workspace = true
predicates = "3.1.4"

[build-dependencies]
clap.workspace = true
clap_complete = "4.6.9"

[[bin]]
name = "creamy"
path = "src/main.rs"
