[package]
name = "creamy-devkit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
creamy-binary = { path = "../creamy-binary", features = ["std"] }
creamy-devkit = { path = "../creamy-devkit", features = ["compile"]}
creamy-xmlc.workspace = true

creamy-protocol-tui.workspace = true
creamy-template.workspace = true
clap.workspace = true
serde.workspace = true
toml.workspace = true
rustyline = "19.0.0"
anyhow.workspace = true
fs-err = { version = "3.3.2", features = ["debug"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile.workspace = true
predicates = "3.1.4"

[build-dependencies]
clap.workspace = true
clap_complete = "4.6.11"

[[bin]]
name = "creamy"
path = "src/main.rs"
