[package]
name = "creamy-binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
creamy-binary-derive = { path = "../creamy-binary-derive" }
embedded-io = { version = "0.7.1", features=["alloc"] }
thiserror.workspace = true
smallvec = "1.16.3"
paste = "1.0.15"
impl-trait-for-tuples = "0.2.3"
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc", "inline-more", "raw-entry", "core"] }

smol_str = { workspace = true, optional = true}
semver = { workspace = true, optional = true }
embedded-io-adapters = { version = "0.7.0" , optional = true, features = ["std"] }

[lints]
workspace = true

[features]
std = ["embedded-io/std", "embedded-io-adapters", "hashbrown/default-hasher"]
smol_str = ["dep:smol_str"]
semver = ["dep:semver", "smol_str"]

[[test]]
name = "vec"
required-features = ["std"]

[[test]]
name = "hashmap"
required-features = ["std"]

[[test]]
name = "smol_str"
required-features = ["smol_str"]

[[test]]
name = "semver"
required-features = ["semver"]
