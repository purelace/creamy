[package]
name = "creamy-devkit"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
compile = []

[dependencies]
creamy-binary = { path = "../creamy-binary", features = ["semver"] }
creamy-xmlc.workspace = true
creamy-manifest.workspace = true
thiserror.workspace = true
semver.workspace = true
fs-err = { version = "3.3.2", features = ["debug"] }

[dev-dependencies]
creamy-template.workspace = true
tempfile.workspace = true

[[test]]
name = "compile"
required-features = ["compile"]

[[test]]
name = "edge_cases"
required-features = ["compile"]

[[test]]
name = "errors"
required-features = ["compile"]
