edition = "2024"

[lints]
workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cbus]
path = ".."

[dependencies.cbus-core]
path = "../../cbus-core"
